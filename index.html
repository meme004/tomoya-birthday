<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ともやくん誕生日アンケート</title>

<style>

body{
font-family:sans-serif;
background:#111;
color:white;
display:flex;
align-items:center;
justify-content:center;
height:100vh;
margin:0;
}

.card{
background:#1e1e1e;
padding:40px;
border-radius:14px;
width:420px;
text-align:center;
}

input{
width:100%;
margin-top:10px;
padding:10px;
border:none;
border-radius:8px;
background:#2a2a2a;
color:white;
}

button{
margin-top:15px;
padding:10px 18px;
border:none;
border-radius:8px;
background:#ff6fae;
color:white;
cursor:pointer;
}

.result{
margin-top:20px;
padding:15px;
background:#2a2a2a;
border-radius:8px;
display:none;
word-break:break-all;
}

</style>
</head>

<body>

<div class="card">

<h1>🎁 誕生日アンケート</h1>
<p>ともやくん、欲しいものを3つ教えて</p>

<input id="w1" placeholder="1つ目">
<input id="w2" placeholder="2つ目">
<input id="w3" placeholder="3つ目">

<button onclick="generateLink()">共有リンクを作る</button>

<div id="result" class="result">

<p>このリンクを友達に送ってください👇</p>

<div id="link"></div>

<button onclick="copyLink()">リンクをコピー</button>

</div>

</div>

<script>

function generateLink(){

const w1=document.getElementById("w1").value
const w2=document.getElementById("w2").value
const w3=document.getElementById("w3").value

const url=window.location.origin+
window.location.pathname+
"?w1="+encodeURIComponent(w1)+
"&w2="+encodeURIComponent(w2)+
"&w3="+encodeURIComponent(w3)

document.getElementById("link").innerText=url
document.getElementById("result").style.display="block"

}

function copyLink(){

const text=document.getElementById("link").innerText

navigator.clipboard.writeText(text)

alert("リンクをコピーしました")

}

function showResult(){

const params=new URLSearchParams(window.location.search)

const w1=params.get("w1")
const w2=params.get("w2")
const w3=params.get("w3")

if(w1||w2||w3){

document.body.innerHTML=`
<div style="display:flex;align-items:center;justify-content:center;height:100vh;background:#111;color:white;font-family:sans-serif;">
<div style="background:#1e1e1e;padding:40px;border-radius:14px;width:420px;text-align:center;">
<h1>🎁 ともやくんの欲望リスト</h1>
<p style="margin-top:20px">1. ${w1||""}</p>
<p>2. ${w2||""}</p>
<p>3. ${w3||""}</p>
</div>
</div>
`

}

}

showResult()

</script>

</body>
</html>
